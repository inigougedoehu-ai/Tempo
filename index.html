<style>

orm:capitalize}.status{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin:0 3px 12px}.dot{width:7px;height:7px;border-radius:50%;background:#32a06b;flex-shrink:0}.dot.warn{background:#d59938}.filters{display:flex;gap:8px;overflow:auto;padding:0 0 12px;scrollbar-width:thin}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:6px 10px;display:flex;gap:7px;align-items:center;font-size:12px}.chip.off{opacity:.45}.swatch{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}.surface{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.scroll{overflow-y:auto;overflow-x:hidden;width:100%;max-width:100%;max-height:calc(100dvh - 240px);min-height:300px;overscroll-behavior:contain}.week{min-width:0;width:100%;max-width:100%}.week.one{min-width:0}.weekhead{display:grid;position:sticky;top:0;z-index:4;background:var(--panel);border-bottom:1px solid var(--line)}.dayhead{text-align:center;border-left:1px solid var(--line);padding:10px 4px;min-width:0}.dayhead strong{display:inline-grid;place-items:center;font-size:20px;width:33px;height:33px;border-radius:50%}.dayhead small{display:block;color:var(--muted);text-transform:capitalize}.today strong{background:#485bd8;color:#fff}.allrow{display:grid;position:sticky;top:74px;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);min-height:24px}.allrow>div{border-left:1px solid var(--line);padding:2px;min-width:0}.allrow .label{font-size:10px;color:var(--muted);padding:5px 2px}.timed{display:grid}.hours{position:relative}.hour{height:var(--hour);font-size:11px;color:var(--muted);text-align:right;padding:0 5px}.daycol{position:relative;border-left:1px solid var(--line);height:calc(24 * var(--hour));background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),var(--line) calc(var(--hour) - 1px),var(--line) var(--hour))}.event{border-radius:6px;background:var(--event,#dce1ff);color:#182033;padding:4px 5px;text-align:left;overflow:hidden;font-size:11px;line-height:1.2;font-weight:600;display:block;width:100%;border:1px solid #0001}.event small{display:block;font-weight:400;font-size:10px}.timed .event{position:absolute;min-height:17px}.allrow .event{margin-bottom:2px;white-space:nowrap;text-overflow:ellipsis}.nowline{position:absolute;left:0;right:0;border-top:2px solid #e34f4f;z-index:2;pointer-events:none}.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.monthlabel{text-align:center;padding:10px 0;font-size:12px;color:var(--muted)}.cell{min-height:104px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:4px;min-width:0}.cell:nth-child(7n){border-right:0}.cell.dim{opacity:.55}.cell .num{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;font-weight:650;margin-bottom:4px}.cell.today .num{color:white;background:#485bd8}.cell .event{white-space:nowrap;text-overflow:ellipsis;margin-bottom:2px}.more{font-size:11px;color:var(--accent);padding:3px}.agenda{padding:8px 16px 20px}.agenda h3{margin:18px 0 8px;text-transform:capitalize;font-size:14px;color:var(--muted)}.agendaitem{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:13px 5px;border-bottom:1px solid var(--line)}.agendaitem .swatch{height:38px;width:5px;border-radius:4px}.agendaitem strong{display:block;overflow-wrap:anywhere}.agendaitem small{color:var(--muted)}.empty{text-align:center;padding:50px 12px;color:var(--muted)}dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:20px;padding:22px;width:min(440px,calc(100% - 24px));max-height:85dvh;overflow:auto}dialog::backdrop{background:#0007}dialog h2{margin:0 0 16px;font-size:22px}dialog .close{float:right;font-size:22px}.setting{padding:14px 0;border-bottom:1px solid var(--line)}.setting label{display:block;font-weight:600;margin-bottom:7px}.setting select{padding:8px;border:1px solid var(--line);background:var(--bg);border-radius:8px}.danger{color:#df5959;font-weight:650}.detailtext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.searchbox{width:min(220px,100%);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:16px}.loading{padding:35px;text-align:center;color:var(--muted)}

<body>
<section id="login" class="login"><main><h1>Tempo<span style="color:var(--accent)">.</span></h1><p>Tu tiempo, en un solo lugar.</p><form id="loginForm"><label for="key">Clave de acceso</label><input class="input" id="key" type="password" required autocomplete="off" placeholder="Introduce tu clave"><label class="check"><input id="remember" type="checkbox" checked> Recordar sesión en este dispositivo</label><button class="primary" id="loginButton">Entrar</button></form><p id="loginStatus" role="status"></p></main></section>
<div id="app" class="shell" hidden><header><div class="brand">Tempo<span>.</span> <small class="build">1.0.3</small></div><div><button id="refresh" class="icon" aria-label="Actualizar">↻</button> <button id="settings" class="icon" aria-label="Ajustes">⚙ Ajustes</button></div></header>
<div class="toolbar"><div class="nav"><button id="prev" aria-label="Anterior">‹</button><button id="today">Hoy</button><button id="next" aria-label="Siguiente">›</button></div><div id="period" class="period"></div><div class="views" id="views"><button data-view="day">Día</button><button data-view="week">Semana</button><button data-view="month">Mes</button><button data-view="agenda">Agenda</button></div><input id="search" class="searchbox" type="search" placeholder="Buscar en la vista" aria-label="Buscar en la vista"></div>
<div class="status" role="status"><span id="dot" class="dot warn"></span><span id="status">Conectando…</span></div><div id="filters" class="filters"></div><main id="calendar" class="surface"></main></div>
<dialog id="detail"><button class="close" aria-label="Cerrar">×</button><h2 id="eventTitle"></h2><p id="eventMeta"></p><p id="eventLocation" class="detailtext"></p><div id="eventDescription" class="detailtext"></div></dialog>
<dialog id="prefs"><button class="close" aria-label="Cerrar">×</button><h2>Ajustes</h2><div class="setting"><label for="theme">Apariencia</label><select id="theme"><option value="auto">Automática</option><option value="light">Clara</option><option value="dark">Oscura</option></select></div><div class="setting"><label>Calendarios visibles</label><div id="settingsFilters"></div></div><div class="setting"><label>Almacenamiento</label><p id="cacheInfo"></p><button id="clear" class="icon">Borrar caché</button></div><div class="setting"><label>Sesión</label><button id="logout" class="danger">Cerrar sesión</button></div></dialog>
<script>
"use strict";
const API="https://script.google.com/macros/s/AKfycbySnnJn5uhX2WOdqGd2gpQd6N5kFFc6JQWa25gNwvlKs7q1MFKc4TWJjwscwtxH1PuU/exec";
const TZ="Europe/Madrid", KEY="tempo.session.v1", PREF="tempo.prefs.v1", DB="tempo-calendar-v1";
const $=id=>document.getElementById(id);
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function load(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback;}catch{return fallback;}}
function store(key,val){try{localStorage.setItem(key,JSON.stringify(val));return true;}catch{return false;}}
function remove(key){try{localStorage.removeItem(key);}catch{}}
let pref=load(PREF,{theme:"auto",view:"week",hidden:[]});if(!Array.isArray(pref.hidden))pref.hidden=[];
let session=null, persistent=false, mainData=null, extraData=null, syncBusy=false, generation=0, pending=false, timer=null, statusText="", warn=true, dbPromise=null;
let view=["day","week","month","agenda"].includes(pref.view)?pref.view:"week";
const partsFmt=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
function parts(t){return Object.fromEntries(partsFmt.formatToParts(t).filter(p=>p.type!=="literal").map(p=>[p.type,p.value]));}
function civil(t=new Date()){const p=parts(t);return p.year+"-"+p.month+"-"+p.day;}
function utc(d){return new Date(d+"T00:00:00Z");}
function add(d,n){const t=utc(d);t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function midnight(d){let guess=utc(d).getTime();for(let i=0;i<3;i++){const p=parts(new Date(guess));const actual=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);guess+=utc(d).getTime()-actual;}return new Date(guess).toISOString();}
function weekStart(d){return add(d,-((utc(d).getUTCDay()+6)%7));}
function monthStart(d){return d.slice(0,7)+"-01";}
function shiftMonth(d,n){const t=utc(monthStart(d));t.setUTCMonth(t.getUTCMonth()+n);return t.toISOString().slice(0,10);}
function fmt(d,opts){return new Intl.DateTimeFormat("es-ES",{timeZone:"UTC",...opts}).format(utc(d));}
function clock(t){return new Intl.DateTimeFormat("es-ES",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date(t));}
let selected=civil();
function windowRange(){const t=civil();return {from:add(t,-30),to:add(t,91)};}
function visibleRange(){if(view==="day")return {from:selected,to:add(selected,1)};if(view==="week"){const f=weekStart(selected);return {from:f,to:add(f,7)};}if(view==="month"){const f=weekStart(monthStart(selected));return {from:f,to:add(f,42)};}return {from:selected,to:add(selected,30)};}
function covers(data,r){return !!data&&data.from<=r.from&&data.to>=r.to;}
function savePref(){pref.view=view;store(PREF,pref);}
function theme(){document.documentElement.dataset.theme=pref.theme==="dark"||(pref.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";$("theme").value=pref.theme;}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",theme);theme();
function db(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore("data");req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});return dbPromise;}
async function cacheOp(mode,action){const d=await db();return new Promise((resolve,reject)=>{const tx=d.transaction("data",mode),req=action(tx.objectStore("data"));let val;req.onsuccess=()=>val=req.result;tx.oncomplete=()=>resolve(val);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}
const readCache=()=>cacheOp("readonly",s=>s.get("window"));
const writeCache=x=>cacheOp("readwrite",s=>s.put(x,"window"));
const clearCache=()=>cacheOp("readwrite",s=>s.clear());
function token(){return Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,"0")).join("");}
async function api(data){const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),25000);try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},credentials:"omit",cache:"no-store",redirect:"follow",signal:ctl.signal,body:JSON.stringify(data)});if(!r.ok)throw Error("HTTP "+r.status);const j=await r.json();if(!j.ok)throw Error(j.error||"ERROR_SERVIDOR");return j;}finally{clearTimeout(timeout);}}
function status(s,w=false){statusText=s;warn=w;$("status").textContent=s;$("dot").classList.toggle("warn",w);}
function stamp(data){return data?.sincronizado?new Intl.DateTimeFormat("es-ES",{timeZone:TZ,day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date(data.sincronizado)):"";}
function dataFor(r){return covers(mainData,r)?mainData:covers(extraData,r)?extraData:null;}
function cacheOwner(){return session?.token;}
function overlaps(e,d){if(e.diaCompleto)return e.inicio<=d&&e.fin>d;return Date.parse(e.inicio)<Date.parse(midnight(add(d,1)))&&Date.parse(e.fin)>Date.parse(midnight(d));}
function prune(data,r){if(!data)return null;const a=midnight(r.from),b=midnight(r.to);return {...data,from:data.from>r.from?data.from:r.from,to:data.to<r.to?data.to:r.to,eventos:data.eventos.filter(e=>e.diaCompleto?e.inicio<r.to&&e.fin>r.from:Date.parse(e.inicio)<Date.parse(b)&&Date.parse(e.fin)>Date.parse(a))};}
async function resetLocal(){generation++;session=null;persistent=false;mainData=null;extraData=null;pending=false;remove(KEY);try{await clearCache();}catch{}$("calendar").replaceChildren();$("filters").replaceChildren();$("settingsFilters").replaceChildren();for(const d of document.querySelectorAll("dialog"))if(d.open)d.close();$("eventTitle").textContent="";$("eventDescription").textContent="";$("eventLocation").textContent="";$("eventMeta").textContent="";$("app").hidden=true;$("login").hidden=false;}
async function signOut(){const old=session;await resetLocal();$("loginStatus").textContent="Sesión cerrada.";if(old)try{await api({accion:"logout",token:old.token});}catch{$("loginStatus").textContent="Sesión local cerrada. No se pudo revocar el token remoto."}}
async function fetchRange(r,t){const j=await api({accion:"eventos",token:t,desde:midnight(r.from),hasta:midnight(r.to)});return {...j,from:r.from,to:r.to};}
async function sync(force=false){if(!session)return;if(session.expiracion<=Date.now()){await resetLocal();$("loginStatus").textContent="Sesión caducada. Introduce tu clave.";return;}if(syncBusy){pending=true;return;}if(!navigator.onLine){status("Sin conexión · "+(stamp(dataFor(visibleRange()))||"sin datos guardados"),true);render();return;}
syncBusy=true;const g=generation,t=session.token,r=windowRange(),v=visibleRange();$("refresh").disabled=true;
try{
 if(!covers(mainData,r)||force||!mainData||Date.now()-Date.parse(mainData.sincronizado)>25000){
  const fresh=await fetchRange(r,t);if(g!==generation)return;
  mainData=fresh;if(persistent)try{await writeCache({owner:cacheOwner(),data:fresh});}catch{}
  render();
 }
 if(g!==generation)return;
 if(!covers(mainData,v)&&(!covers(extraData,v)||force||Date.now()-Date.parse(extraData.sincronizado)>25000)){const fresh=await fetchRange(v,t);if(g!==generation)return;extraData=fresh;}
 if(g!==generation)return;
 const d=dataFor(visibleRange());status(d?"Actualizado · "+stamp(d):"Consultando fechas…",!d);
}catch(e){if(g!==generation)return;if(e.message==="NO_AUTORIZADO"){await resetLocal();$("loginStatus").textContent="La sesión ya no es válida. Introduce tu clave.";}else status("No se pudo actualizar · "+(stamp(dataFor(visibleRange()))||"sin datos guardados"),true);}
finally{syncBusy=false;$("refresh").disabled=false;if(g===generation&&session)render();if(pending){pending=false;if(session)sync();}}
}
async function enter(s,remember,restore){session=s;persistent=remember;generation++;const g=generation;mainData=null;extraData=null;$("login").hidden=true;$("app").hidden=false;status("Conectando…",true);render();if(remember&&restore){try{const c=await readCache();if(g!==generation)return;if(c?.owner===s.token&&c.data){mainData=prune(c.data,windowRange());status("Datos guardados · "+stamp(mainData),true);render();try{await writeCache({owner:s.token,data:mainData});}catch{}}}catch{}}
 if(g===generation)sync(true);
}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginButton").disabled=true;$("loginStatus").textContent="Conectando…";const t=token(),clave=$("key").value.trim();$("key").value="";try{const j=await api({accion:"login",clave,token:t});const s={token:t,expiracion:j.expiracion};let remember=$("remember").checked;if(remember)remember=store(KEY,s);else remove(KEY);try{await clearCache();}catch{}await enter(s,remember,false);}catch(e){$("loginStatus").textContent=e.message==="CREDENCIALES_INVALIDAS"?"Clave incorrecta.":"No se pudo conectar. Comprueba tu conexión e inténtalo otra vez.";}finally{$("loginButton").disabled=false;}});
function visibleEvents(data){const q=$("search").value.trim().toLocaleLowerCase("es");return (data?.eventos||[]).filter(e=>!pref.hidden.includes(e.calendarioId)&&(!q||[e.titulo,e.ubicacion,e.descripcion].some(s=>String(s||"").toLocaleLowerCase("es").includes(q))));}
function safeColor(c){return /^#[0-9a-f]{6}$/i.test(c||"")?c:"#dce1ff";}
function showEvent(e){$("eventTitle").textContent=e.titulo;$("eventMeta").textContent=(e.diaCompleto?fmt(e.inicio,{dateStyle:"full"})+" · Todo el día":fmt(civil(new Date(e.inicio)),{dateStyle:"full"})+" · "+clock(e.inicio)+" – "+clock(e.fin))+" · "+((dataFor(visibleRange())?.calendarios||mainData?.calendarios||[]).find(c=>c.id===e.calendarioId)?.nombre||"");$("eventLocation").textContent=e.ubicacion||"";$("eventDescription").textContent=e.descripcion||"";$("detail").showModal();}
function eventButton(e,withTime=false){const n=el("button","event",e.titulo);n.style.setProperty("--event",safeColor(e.color));if(withTime&&!e.diaCompleto)n.append(el("small","",clock(e.inicio)+" – "+clock(e.fin)));n.addEventListener("click",()=>showEvent(e));n.title=e.titulo;return n;}
function dayJump(d){selected=d;view="day";savePref();navigate();}
function filters(data){const cals=data?.calendarios||mainData?.calendarios||extraData?.calendarios||[];$("filters").replaceChildren();$("settingsFilters").replaceChildren();for(const c of cals){const b=el("button","chip"+(pref.hidden.includes(c.id)?" off":""));const dot=el("span","swatch");dot.style.background=safeColor(c.color);b.append(dot,document.createTextNode(c.nombre));b.setAttribute("aria-pressed",String(!pref.hidden.includes(c.id)));const toggle=()=>{pref.hidden=pref.hidden.includes(c.id)?pref.hidden.filter(x=>x!==c.id):[...pref.hidden,c.id];savePref();render();};b.onclick=toggle;$("filters").append(b);const l=el("label","check"),i=el("input");i.type="checkbox";i.checked=!pref.hidden.includes(c.id);i.onchange=toggle;l.append(i,document.createTextNode(c.nombre));$("settingsFilters").append(l);}}
function minutes(t){const p=parts(new Date(t));return +p.hour*60 + +p.minute;}
function renderWeek(r,events,container){const days=[];for(let d=r.from;d<r.to;d=add(d,1))days.push(d);const sc=el("div","scroll"),w=el("div","week"+(days.length===1?" one":""));const grid="var(--time-col,44px) repeat("+days.length+",minmax(0,1fr))";const head=el("div","weekhead");head.style.gridTemplateColumns=grid;head.append(el("div"));for(const d of days){const h=el("button","dayhead"+(d===civil()?" today":""));h.append(el("small","",fmt(d,{weekday:"short"})),el("strong","",String(+d.slice(-2))));h.onclick=()=>dayJump(d);head.append(h);}w.append(head);const ar=el("div","allrow");ar.style.gridTemplateColumns=grid;ar.append(el("div","label","Todo el día"));for(const d of days){const cell=el("div");for(const e of events.filter(e=>e.diaCompleto&&overlaps(e,d)))cell.append(eventButton(e));ar.append(cell);}w.append(ar);const timed=el("div","timed");timed.style.gridTemplateColumns=grid;const hours=el("div","hours");for(let h=0;h<24;h++)hours.append(el("div","hour",String(h).padStart(2,"0")+":00"));timed.append(hours);for(const d of days){const col=el("div","daycol");const items=events.filter(e=>!e.diaCompleto&&overlaps(e,d)).map(e=>({e,start:civil(new Date(e.inicio))<d?0:minutes(e.inicio),end:civil(new Date(e.fin))>d?1440:minutes(e.fin)})).map(x=>({...x,end:Math.min(1440,Math.max(x.start+15,x.end))})).sort((a,b)=>a.start-b.start||b.end-a.end);let cluster=[],end=-1;function flush(){if(!cluster.length)return;const lanes=[];for(const x of cluster){let lane=lanes.findIndex(y=>y<=x.start);if(lane<0)lane=lanes.length;lanes[lane]=x.end;x.lane=lane;}for(const x of cluster){const b=eventButton(x.e,true);b.style.top=(x.start/1440*100)+"%";b.style.height=((x.end-x.start)/1440*100)+"%";b.style.left=(x.lane/lanes.length*100)+"%";b.style.width="calc("+100/lanes.length+"% - 2px)";col.append(b);}cluster=[];end=-1;}for(const x of items){if(x.start>=end)flush();cluster.push(x);end=Math.max(end,x.end);}flush();if(d===civil()){const line=el("div","nowline");line.style.top=minutes(new Date())/1440*100+"%";col.append(line);}timed.append(col);}w.append(timed);sc.append(w);container.append(sc);return sc;}
function renderMonth(r,events,container){const m=el("div","month");for(const d of ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"])m.append(el("div","monthlabel",d));for(let d=r.from;d<r.to;d=add(d,1)){const date=d,cell=el("div","cell"+(d.slice(0,7)!==selected.slice(0,7)?" dim":"")+(d===civil()?" today":""));const n=el("button","num",String(+d.slice(-2)));n.onclick=()=>dayJump(date);cell.append(n);const items=events.filter(e=>overlaps(e,date));for(const e of items.slice(0,3))cell.append(eventButton(e));if(items.length>3){const more=el("button","more","+"+(items.length-3)+" más");more.onclick=()=>dayJump(date);cell.append(more);}m.append(cell);}container.append(m);}
function renderAgenda(r,events,container){const a=el("div","agenda");let count=0;for(let d=r.from;d<r.to;d=add(d,1)){const items=events.filter(e=>overlaps(e,d));if(!items.length)continue;a.append(el("h3","",fmt(d,{dateStyle:"full"})));for(const e of items){count++;const b=el("button","agendaitem"),s=el("span","swatch"),info=el("div");s.style.background=safeColor(e.color);info.append(el("strong","",e.titulo),el("small","",e.diaCompleto?"Todo el día":clock(e.inicio)+" – "+clock(e.fin)));b.append(s,info);b.onclick=()=>showEvent(e);a.append(b);}}if(!count)a.append(el("div","empty","No hay eventos en este periodo."));container.append(a);}
let lastRangeKey="";
function render(){if(!session)return;const r=visibleRange(),data=dataFor(r),container=$("calendar"),old=container.querySelector(".scroll"),key=view+r.from+r.to,oldTop=old?.scrollTop,oldLeft=old?.scrollLeft;$("period").textContent=view==="month"?fmt(selected,{month:"long",year:"numeric"}):view==="day"?fmt(selected,{weekday:"short",day:"numeric",month:"long"}):fmt(r.from,{day:"numeric",month:"short"})+" – "+fmt(add(r.to,-1),{day:"numeric",month:"short",year:"numeric"});for(const b of $("views").querySelectorAll("button"))b.classList.toggle("active",b.dataset.view===view);filters(data);container.replaceChildren();if(!data){container.append(el("div","loading",navigator.onLine?"Consultando calendario…":"Fechas no guardadas. Conéctate para consultarlas."));return;}const events=visibleEvents(data);if(view==="month")renderMonth(r,events,container);else if(view==="agenda")renderAgenda(r,events,container);else{const s=renderWeek(r,events,container);if(key===lastRangeKey&&old){s.scrollTop=oldTop;s.scrollLeft=0;}else{s.scrollTop=7*54;s.scrollLeft=0;}}lastRangeKey=key;}
function navigate(){render();const d=dataFor(visibleRange());status(d?"Datos guardados · "+stamp(d):"Consultando fechas…",true);sync();}
$("prev").onclick=()=>{selected=view==="month"?shiftMonth(selected,-1):add(selected,view==="day"?-1:view==="week"?-7:-30);navigate();};$("next").onclick=()=>{selected=view==="month"?shiftMonth(selected,1):add(selected,view==="day"?1:view==="week"?7:30);navigate();};$("today").onclick=()=>{selected=civil();navigate();};$("views").onclick=e=>{const b=e.target.closest("button[data-view]");if(b){view=b.dataset.view;savePref();navigate();}};$("search").oninput=render;$("refresh").onclick=()=>{status("Actualizando…",true);sync(true);};$("settings").onclick=()=>{$("cacheInfo").textContent=mainData?("Ventana de 30 días anteriores y 90 posteriores · "+Math.round(new TextEncoder().encode(JSON.stringify(mainData)).length/1024)+" KB de datos"):"Sin caché disponible";$("prefs").showModal();};$("theme").onchange=e=>{pref.theme=e.target.value;savePref();theme();};$("clear").onclick=async()=>{mainData=null;extraData=null;try{await clearCache();}catch{}$("cacheInfo").textContent="Caché borrada. Se descargará nuevamente al actualizar.";render();};$("logout").onclick=signOut;for(const d of document.querySelectorAll("dialog"))d.querySelector(".close").onclick=()=>d.close();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&session)sync(true);});addEventListener("online",()=>sync(true));addEventListener("offline",()=>{if(session)status("Sin conexión · "+(stamp(dataFor(visibleRange()))||"sin datos guardados"),true);});setInterval(()=>{if(session&&!document.hidden)sync(true);},30000);
const remembered=load(KEY,null);if(remembered&&/^[a-f0-9]{64}$/.test(remembered.token||"")&&remembered.expiracion>Date.now())enter(remembered,true,true);else{remove(KEY);clearCache().catch(()=>{});}
</script></body></html>
